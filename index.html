<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Group Chat – Year 7</title>
<style>
:root{
  --navy:#1B2A4A; --ink:#16203A; --teal:#1F8F88; --teal-lt:#7FD4CE; --amber:#D98A0B;
  --amber-lt:#FFF4D6; --bg:#F4F6FA; --card:#FFFFFF; --line:#C9D2E4; --muted:#6B7691;
  --good:#1E8E4E; --good-lt:#E3F5EA; --bad:#C0392B; --bad-lt:#FBE8E8; --zebra:#EEF2F9;
  --chat:#E9EEF6; --me:#D7F2EF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.45}
button{font:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:22px}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--teal-lt);letter-spacing:1px;text-transform:uppercase}
.dots{display:flex;gap:8px;margin-left:auto;align-items:center}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#c8d0e2;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.dot.on{background:var(--teal);border-color:var(--teal);color:#fff}
.dot.done{background:rgba(255,255,255,.18);color:#fff}
.rule{background:var(--bad);color:#fff;text-align:center;padding:8px 16px;font-weight:700;font-size:16px}
main{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:28px;color:var(--navy);margin:0 0 8px}
h2{font-size:23px;color:var(--navy);margin:0 0 10px}
h3{font-size:19px;color:var(--navy);margin:0 0 6px}
.kicker{color:var(--teal);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:15px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.note{background:var(--zebra);border-radius:10px;padding:12px 16px;font-size:16px}

/* ---------- intro */
.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.cast{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.who{display:flex;gap:10px;align-items:center;background:var(--zebra);border-radius:12px;padding:10px 12px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:0 0 40px}
.steps{padding-left:24px;margin:8px 0}
.steps li{margin:6px 0}

/* ---------- scene */
.scene{display:grid;grid-template-columns:420px 1fr;gap:24px;align-items:start}
.phone{background:#fff;border:10px solid var(--navy);border-radius:34px;overflow:hidden;box-shadow:0 8px 24px rgba(27,42,74,.18)}
.phead{background:var(--navy);color:#fff;padding:10px 16px 12px;display:flex;align-items:center;gap:10px}
.phead .gname{font-weight:700;font-size:17px}
.phead .gsub{font-size:12px;color:var(--teal-lt)}
.pbody{background:var(--chat);min-height:440px;max-height:520px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.sys{align-self:center;background:rgba(27,42,74,.08);color:var(--muted);font-size:13px;border-radius:999px;padding:4px 12px;text-align:center}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:pop .25s ease-out}
.msg .av{width:30px;height:30px;flex:0 0 30px;font-size:13px}
.bub{background:#fff;border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:16px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bub .nm{font-size:12px;font-weight:700;margin-bottom:2px}
.bub .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--me);border-radius:14px 14px 4px 14px}
.pic{background:repeating-linear-gradient(45deg,#f2f4f9,#f2f4f9 8px,#e6eaf2 8px,#e6eaf2 16px);border:1.5px dashed var(--muted);border-radius:10px;padding:16px 10px;text-align:center;font-size:14px;color:var(--muted);margin:4px 0}
.pic b{display:block;font-size:26px;margin-bottom:4px}
.react{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;align-self:flex-start;margin-left:38px;margin-top:-4px}
.private{align-self:center;background:var(--amber-lt);border:1px solid var(--amber);color:#7a4d00;font-size:13px;border-radius:8px;padding:4px 10px;font-weight:700}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.qcard h2{margin-bottom:4px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--teal)}
.choice .L{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.choice.picked{border-color:var(--navy);background:var(--zebra)}
.choice:disabled{cursor:default;opacity:.55}
.choice.picked:disabled{opacity:1}
.talk{background:var(--amber-lt);border-left:5px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:16px;margin-top:12px}
.fb{border-radius:12px;padding:16px 18px;margin-top:16px;border:2px solid}
.fb .tag{display:inline-block;font-weight:700;font-size:14px;letter-spacing:1px;border-radius:999px;padding:3px 12px;color:#fff;margin-bottom:8px}
.fb.good{background:var(--good-lt);border-color:var(--good)} .fb.good .tag{background:var(--good)}
.fb.mid{background:var(--amber-lt);border-color:var(--amber)} .fb.mid .tag{background:var(--amber)}
.fb.bad{background:var(--bad-lt);border-color:var(--bad)} .fb.bad .tag{background:var(--bad)}
.fb p{margin:6px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}

/* ---------- STOP card */
.stop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stop div{background:#E6F4F3;border:1.5px solid var(--teal);border-radius:12px;padding:10px 12px;font-size:15px}
.stop b{display:block;color:var(--navy);font-size:16px}
.stop b span{color:var(--teal);font-size:24px;margin-right:6px}

/* ---------- end */
table.sum{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}
table.sum th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px}
table.sum td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.sum tr:nth-child(even) td{background:var(--zebra)}
.pill{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.5px;border-radius:999px;padding:2px 10px;color:#fff}
.pill.good{background:var(--good)} .pill.mid{background:var(--amber)} .pill.bad{background:var(--bad)}
.tell{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.tell div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:700;color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
@media (max-width:960px){.scene,.intro,.two{grid-template-columns:1fr}.stop,.tell{grid-template-columns:1fr 1fr}.phone{max-width:440px;margin:0 auto}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><small>Year 7 · Lesson 05 · When things go wrong</small>The Group Chat</div>
  <nav class="dots" id="dots" aria-label="Progress"></nav>
</header>
<div class="rule">Everyone in here is made up. Never type a real name.</div>

<main id="app"></main>

<script>
/* ------------------------------------------------------------------
   The Group Chat — Year 7 Lesson 05 (cyberbullying and unkind contact)
   Everything runs in the browser. Nothing is typed, sent or saved.
   If a pupil in the class shares one of these names, change it here.
------------------------------------------------------------------ */
const N = {me:"Omar", target:"Layla", poster:"Hamad", a:"Yousef", b:"Sara", c:"Rami"};
const COL = {Omar:"#1F8F88", Layla:"#8E44AD", Hamad:"#C0392B", Yousef:"#2E6DB4", Sara:"#D98A0B", Rami:"#5D6D7E", "?":"#6B7691", "layla_real_x":"#8E44AD"};
const ini = n => n === "?" ? "?" : n[0].toUpperCase();

const SCENES = [
 {
  day:"Monday · 7:42 pm", title:"The photo", group:"Year 7 Squad", sub:"24 members",
  chat:[
   ["sys","Monday"],
   ["m",N.poster,"look at this 😂😂", "7:40"],
   ["pic",N.poster,"🤡","A school photo of "+N.target+", edited with a clown nose and the words “NOBODY INVITED ME”.","7:40"],
   ["m",N.a,"HAHAHA 😂","7:41"],
   ["m",N.c,"😂😂😂","7:41"],
   ["react","😂 14"],
  ],
  q:"Everyone is laughing. "+N.target+" is in this chat too. What does "+N.me+" do?",
  opts:[
   {t:"Add a 😂. Everyone else did.", k:"bad", tag:"JOINED IN",
    fb:["Now there are 15 laughing faces, not 14.","Every laugh tells "+N.poster+" it worked. It tells "+N.target+" that everyone agrees.","Joining in makes you part of it."],
    after:[["m",N.poster,"see even "+N.me+" thinks it's funny 😂","7:43"]]},
   {t:"Say nothing. Scroll past.", k:"mid", tag:"BYSTANDER",
    fb:["Doing nothing feels safe.","But "+N.target+" can see who read it. To her, silence can look like everyone agrees.","A bystander is not the bully. But the bully needs bystanders."],
    after:[["sys","Seen by 23"]]},
   {t:"Message "+N.target+" privately: “You OK? That wasn't fair.”", k:"good", tag:"UPSTANDER",
    fb:["Small, safe, and it matters. "+N.target+" knows she is not alone.","You could also tell her about STOP: do not reply, take a screenshot, block and report, tell a teacher.","If you feel safe, you can also say “not funny” in the chat. You never have to."],
    after:[["private","Private chat with "+N.target],["me",N.me,"you ok? that wasn't fair","7:44"],["m",N.target,"thanks "+N.me+" 😔 I feel so embarrassed","7:45"]]},
   {t:"Reply: “"+N.poster+", you're so ugly, that's why you do this.”", k:"bad", tag:"HIT BACK",
    fb:["It feels fair. But now there are two unkind messages, and one is yours.","Hitting back keeps it going. It also makes it harder for a teacher to sort out.","An upstander helps without being unkind back."],
    after:[["me",N.me,N.poster+" you're so ugly that's why you do this","7:43"],["m",N.poster,"wow ok 🙄 at least I'm not "+N.target,"7:43"]]}
  ]
 },
 {
  day:"Wednesday · 6:15 pm", title:"The new chat", group:"Year 7 Squad 2 🔒", sub:"23 members",
  chat:[
   ["sys",N.poster+" created the group “Year 7 Squad 2”"],
   ["sys",N.poster+" added you"],
   ["m",N.poster,"new chat 😎 DON'T add "+N.target,"6:12"],
   ["m",N.a,"lol ok","6:13"],
   ["m",N.b,"why not?","6:13"],
   ["m",N.poster,"she's annoying. like last time","6:14"],
  ],
  q:N.target+" is left out on purpose. It is the second time this month. What does "+N.me+" do?",
  opts:[
   {t:"Say “ok 👍”. It's only a chat.", k:"bad", tag:"JOINED IN",
    fb:["Leaving someone out on purpose, again and again, is cyberbullying.","It counts even when nobody says a mean word to her.","Saying ok helps it happen."],
    after:[["me",N.me,"ok 👍","6:15"]]},
   {t:"Back "+N.b+" up: “Yeah, why not? Leaving her out isn't fair.”", k:"good", tag:"UPSTANDER",
    fb:[N.b+" spoke first. When one person speaks up, others often follow.","You stood up for "+N.target+" without being unkind back.","If it keeps happening, tell a teacher as well."],
    after:[["me",N.me,"yeah why not? leaving her out isn't fair","6:15"],["m",N.c,"ye true. add her","6:16"]]},
   {t:"Leave the new chat. Tell a teacher it keeps happening.", k:"good", tag:"UPSTANDER",
    fb:["That is the P in STOP: pass it on.","A teacher can deal with it without you being in the middle.","Telling is not snitching. It is getting help for someone."],
    after:[["sys",N.me+" left the group"]]},
   {t:"Screenshot it and send it to "+N.target+" so she knows.", k:"mid", tag:"NOT HELPFUL",
    fb:["You meant well.","But now "+N.target+" sees it alone, at home, with no adult to help.","Screenshots go to a trusted adult, not to the person being hurt."],
    after:[["private","Private chat with "+N.target],["m",N.target,"why would they do that 😢","6:20"]]}
  ]
 },
 {
  day:"Thursday · 8:30 pm", title:"The fake account", group:"Year 7 Squad", sub:"25 members",
  chat:[
   ["sys","layla_real_x joined using a link"],
   ["pic","layla_real_x","👤","Profile picture: "+N.target+"'s school photo.","8:26"],
   ["m","layla_real_x","hi im "+N.target.toLowerCase()+" and i smell lol","8:27"],
   ["m",N.poster,"😂😂😂","8:27"],
   ["private","Private chat with "+N.target],
   ["m",N.target,N.me+" that's NOT me!! someone made it. what do I do??","8:29"],
  ],
  q:N.target+" asks "+N.me+" for help. What should he tell her?",
  opts:[
   {t:"“Reply to the fake account. Tell them to stop.”", k:"mid", tag:"NOT YET",
    fb:["Replying gives them what they want: a reaction.","STOP starts with S: stop. Do not reply.","Screenshot it first, then block and report."],
    after:[["me",N.me,"reply and tell them to stop","8:30"],["m",N.target,"I did. they just posted more 😭","8:34"]]},
   {t:"“Take screenshots. Then report the account on the app.”", k:"good", tag:"STOP: T + O",
    fb:["T: take a screenshot. Get the name, the messages and the time.","O: opt out. Report it as “pretending to be someone”. Most apps remove fake accounts.","One step left: P, pass it on. Tell a teacher too."],
    after:[["me",N.me,"screenshot everything. then report the account","8:30"],["m",N.target,"done. reported it as a fake","8:33"]]},
   {t:"“Delete the app so you never see it.”", k:"mid", tag:"NOT YET",
    fb:["Taking a break is fine. But do it AFTER the screenshots.","If she deletes it now, the proof is gone.","And the fake account keeps posting while she is away."],
    after:[["me",N.me,"just delete the app","8:30"],["m",N.target,"but then how do I show anyone?","8:31"]]},
   {t:"“Tell your form tutor tomorrow. I'll come with you.”", k:"good", tag:"STOP: P",
    fb:["P: pass it on. Going with a friend makes it easier.","Best of all: take screenshots first, then tell.","Any teacher she feels comfortable with is fine."],
    after:[["me",N.me,"tell your form tutor tomorrow. I'll come with you","8:30"],["m",N.target,"ok. thank you 🙏","8:31"]]}
  ]
 },
 {
  day:"Friday · 11:04 pm", title:"Now it's "+N.me, group:"+974 •••• ••47", sub:"not in your contacts",
  chat:[
   ["sys","Friday"],
   ["m","?","you snitch 🐀","11:04 pm"],
   ["m","?","nobody wants you in the squad","11:06 pm"],
   ["m","?","everyone is laughing at you","11:15 pm"],
  ],
  q:"Now it is happening to "+N.me+". It is late at night. What does he do?",
  opts:[
   {t:"Reply: “Who is this?? Leave me alone!”", k:"mid", tag:"NOT YET",
    fb:["S in STOP: stop, do not reply.","A reply shows it worked. It can keep it going all night.","Screenshot, block, then tell someone."],
    after:[["me",N.me,"who is this?? leave me alone!","11:16 pm"],["m","?","😂😂 aww is he upset","11:16 pm"]]},
   {t:"Screenshot them, block the number, and put the phone away.", k:"good", tag:"STOP: S + T + O",
    fb:["Stop. Take a screenshot. Opt out. Three steps done.","Putting the phone away is a good idea too.","One step left: P. Tell an adult tomorrow."],
    after:[["sys","You blocked this number"]]},
   {t:"Tell a parent tonight, or a teacher on Sunday. Show the screenshots.", k:"good", tag:"STOP: P",
    fb:["P: pass it on. You never have to deal with this alone.","Telling is not snitching. It is getting help.","Screenshots make it much easier for the adult to act."],
    after:[["sys",N.me+" took 3 screenshots"]]},
   {t:"Delete them and tell nobody. It might stop.", k:"bad", tag:"ALONE",
    fb:["It rarely stops on its own.","And now there is no proof to show anyone.","Keep the screenshots. Then tell an adult you trust."],
    after:[["sys","Messages deleted"],["m","?","still there? 😂","11:40 pm"]]}
  ]
 }
];

/* ------------------------------------------------------------------ state */
let scene = -1;           // -1 intro, 0..3 scenes, 4 end
let first = [null,null,null,null];
let current = null;
const app = document.getElementById('app');

function dots(){
  const d = document.getElementById('dots');
  d.innerHTML = SCENES.map((s,i)=>{
    let c = 'dot';
    if (i === scene) c += ' on'; else if (first[i] !== null) c += ' done';
    return `<span class="${c}" title="Scene ${i+1}">${i+1}</span>`;
  }).join('');
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function line(item){
  const [type] = item;
  if (type === 'sys') return `<div class="sys">${esc(item[1])}</div>`;
  if (type === 'private') return `<div class="private">🔒 ${esc(item[1])}</div>`;
  if (type === 'react') return `<div class="react">${esc(item[1])}</div>`;
  const who = item[1];
  const col = COL[who] || '#6B7691';
  if (type === 'pic'){
    return `<div class="msg"><div class="av" style="background:${col}">${ini(who)}</div>
      <div class="bub"><div class="nm" style="color:${col}">${esc(who)}</div>
      <div class="pic"><b>${item[2]}</b>${esc(item[3])}</div><div class="tm">${esc(item[4])}</div></div></div>`;
  }
  const me = (type === 'me');
  return `<div class="msg${me?' me':''}"><div class="av" style="background:${col}">${ini(who)}</div>
    <div class="bub">${me?'':`<div class="nm" style="color:${col}">${esc(who)}</div>`}${esc(item[2])}<div class="tm">${esc(item[3])}</div></div></div>`;
}

function stopCard(){
  return `<div class="stop">
    <div><b><span>S</span>Stop</b>Do not reply.</div>
    <div><b><span>T</span>Take a screenshot</b>Save the proof: name, message, time.</div>
    <div><b><span>O</span>Opt out</b>Block, mute or leave. Report it on the app.</div>
    <div><b><span>P</span>Pass it on</b>Tell a teacher or adult you trust.</div></div>`;
}

/* ------------------------------------------------------------------ intro */
function intro(){
  scene = -1; dots();
  const cast = [[N.me,"you"],[N.target,"in your class"],[N.poster,"in your class"],[N.b,"in your class"]];
  app.innerHTML = `
  <div class="panel intro">
    <div>
      <div class="kicker">Before you start</div>
      <h1>You are ${N.me}.</h1>
      <p>${N.me} is in the <b>Year 7 Squad</b> group chat. Four things happen this week.
         At each one, you choose what ${N.me} does.</p>
      <ol class="steps">
        <li><b>Pairs.</b> One person clicks. One person reads aloud.</li>
        <li><b>Talk first.</b> Say <i>why</i> before you click.</li>
        <li><b>Write down your FIRST choice</b> (A, B, C or D) in Part 2 of your worksheet.</li>
        <li>Then you can try the other choices to see what happens.</li>
      </ol>
      <div class="row"><button class="btn" onclick="go(0)">Start: Monday ▶</button></div>
    </div>
    <div>
      <h3>Who is who</h3>
      <div class="cast">${cast.map(([n,r])=>`<div class="who"><div class="av" style="background:${COL[n]}">${ini(n)}</div><div><b>${n}</b><br><span class="small muted">${r}</span></div></div>`).join('')}</div>
      <div class="note" style="margin-top:14px">Nothing you click is saved or sent anywhere.
      Every name and message here is made up.</div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ scene */
function go(i){
  scene = i; current = null; dots();
  const s = SCENES[i];
  app.innerHTML = `
  <div class="scene">
    <div class="phone">
      <div class="phead"><div class="av" style="background:var(--teal)">${i===3?'?':'#'}</div>
        <div><div class="gname">${esc(s.group)}</div><div class="gsub">${esc(s.sub)}</div></div></div>
      <div class="pbody" id="pbody"></div>
    </div>
    <div class="panel qcard">
      <div class="kicker">Scene ${i+1} of 4 · ${esc(s.day)}</div>
      <h2>${esc(s.title)}</h2>
      <p style="font-size:20px;margin:6px 0 0"><b>${esc(s.q)}</b></p>
      <div class="talk">Talk first. Start like this: <b>“I would choose … because …”</b></div>
      <div class="choices" id="choices">
        ${s.opts.map((o,j)=>`<button class="choice" data-j="${j}" onclick="choose(${j})"><span class="L">${'ABCD'[j]}</span><span>${esc(o.t)}</span></button>`).join('')}
      </div>
      <div id="fb"></div>
    </div>
  </div>`;
  const pb = document.getElementById('pbody');
  s.chat.forEach((c,k)=>setTimeout(()=>{pb.insertAdjacentHTML('beforeend', line(c)); pb.scrollTop = pb.scrollHeight;}, 350*k));
}

function choose(j){
  const s = SCENES[scene];
  const o = s.opts[j];
  if (first[scene] === null) first[scene] = j;
  current = j;
  document.querySelectorAll('.choice').forEach(b=>{
    b.classList.toggle('picked', +b.dataset.j === j);
    b.disabled = true;
  });
  // rebuild the chat, then add what happens next
  const pb = document.getElementById('pbody');
  pb.innerHTML = s.chat.map(line).join('');
  o.after.forEach((c,k)=>setTimeout(()=>{pb.insertAdjacentHTML('beforeend', line(c)); pb.scrollTop = pb.scrollHeight;}, 300*(k+1)));
  document.getElementById('fb').innerHTML = `
    <div class="fb ${o.k}">
      <span class="tag">${o.tag}</span>
      ${o.fb.map(p=>`<p>${esc(p)}</p>`).join('')}
    </div>
    <p class="small muted" style="margin:10px 0 0">Your first choice in this scene: <b>${'ABCD'[first[scene]]}</b>. Write it in Part 2.</p>
    <div class="row">
      <button class="btn ghost" onclick="again()">Try another choice</button>
      <button class="btn" onclick="${scene<3?`go(${scene+1})`:'end()'}">${scene<3?'Next scene ▶':'See my week ▶'}</button>
    </div>`;
}

function again(){
  document.querySelectorAll('.choice').forEach(b=>{ b.disabled = false; b.classList.remove('picked'); });
  document.getElementById('fb').innerHTML = '';
  document.getElementById('pbody').innerHTML = SCENES[scene].chat.map(line).join('');
}

/* ------------------------------------------------------------------ end */
function end(){
  scene = 4; dots();
  const rows = SCENES.map((s,i)=>{
    const j = first[i];
    if (j === null) return `<tr><td>${i+1} · ${esc(s.title)}</td><td>—</td><td>not played</td></tr>`;
    const o = s.opts[j];
    return `<tr><td>${i+1} · ${esc(s.title)}</td><td><b>${'ABCD'[j]}</b></td><td><span class="pill ${o.k}">${o.tag}</span></td></tr>`;
  }).join('');
  const good = first.filter((j,i)=>j!==null && SCENES[i].opts[j].k==='good').length;
  app.innerHTML = `
  <div class="panel">
    <div class="kicker">The end of ${N.me}'s week</div>
    <h1>Your first choices</h1>
    <table class="sum"><tr><th>Scene</th><th>First choice</th><th>What it was</th></tr>${rows}</table>
    <p class="small" style="margin-top:10px">Green choices first time: <b>${good} / 4</b>. Check Part 2 of your worksheet matches.</p>
    <div class="two">
      <div>
        <h3>The four steps: STOP</h3>
        ${stopCard()}
      </div>
      <div>
        <h3>Who can you tell at USI?</h3>
        <p class="small" style="margin:0">Any teacher you feel comfortable with. For example:</p>
        <div class="tell"><div>Your form tutor</div><div>Any subject teacher</div><div>The school counsellor</div><div>An adult at home</div></div>
      </div>
    </div>
    <div class="talk" style="margin-top:18px">Talk with your partner: <b>which scene was the hardest to be an upstander in? Why?</b><br>
    Start like this: <b>“Scene … was hardest because …”</b></div>
    <div class="row">
      <button class="btn ghost" onclick="first=[null,null,null,null];intro()">Start again</button>
    </div>
  </div>`;
}

intro();
</script>
</body>
</html>
